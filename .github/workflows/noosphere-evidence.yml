name: Noosphere shared-core evidence checks

on:
  push:
    branches: [main]
    paths:
      - "noosphere_lite/federation*.py"
      - "noosphere_lite/code_context_r05.py"
      - "tests/test_federation*.py"
      - "tests/test_code_context_r05.py"
      - ".github/workflows/noosphere-evidence.yml"
  pull_request:
    paths:
      - "noosphere_lite/federation*.py"
      - "noosphere_lite/code_context_r05.py"
      - "tests/test_federation*.py"
      - "tests/test_code_context_r05.py"
      - ".github/workflows/noosphere-evidence.yml"

permissions:
  contents: read

jobs:
  shared-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Federation source and lineage tests
        run: python -m unittest discover -s tests -p 'test_federation*.py' -v
      - name: Evidence-grounded CodeContext tests
        run: python -m unittest discover -s tests -p 'test_code_context_r05.py' -v
