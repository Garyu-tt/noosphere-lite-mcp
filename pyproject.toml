[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noosphere-lite-mcp"
version = "0.3.0"
description = "Linux-native MCP memory with encrypted mirrored journals and links"
license = "GPL-3.0-or-later"
authors = [{name = "Garyu-tt"}]
requires-python = ">=3.11"
dependencies = ["cryptography>=42,<47", "mcp>=1.9,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["noosphere_lite*"]

[project.scripts]
noosphere-lite = "noosphere_lite.__main__:main"

